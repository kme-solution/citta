name: citta
services:
  ollama:
    image: ollama/ollama:0.40.17
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    cpus: 3
    mem_limit: 8g
    volumes:
      - ollama-models:/root/.ollama
volumes:
  ollama-models:
    name: citta-ollama-models
